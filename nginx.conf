events {
    worker_connections 1024;
}

http {
    upstream data-service {
        server data-service:8006;
    }
    
    upstream strategy-engine {
        server strategy-engine:8001;
    }
    
    upstream backtest-service {
        server backtest-service:8002;
    }
    
    upstream trading-service {
        server trading-service:8003;
    }
    
    upstream portfolio-service {
        server portfolio-service:8004;
    }
    
    upstream risk-service {
        server risk-service:8005;
    }

    server {
        listen 80;

        location /ws/ {
            proxy_pass http://data-service/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /api/data/ {
            proxy_pass http://data-service/;
        }
        
        location /api/strategy/ {
            proxy_pass http://strategy-engine/;
        }
        
        location /api/backtest/ {
            proxy_pass http://backtest-service/;
        }
        
        location /api/trading/ {
            proxy_pass http://trading-service/;
        }
        
        location /api/portfolio/ {
            proxy_pass http://portfolio-service/;
        }
        
        location /api/risk/ {
            proxy_pass http://risk-service/;
        }
        
        location / {
            proxy_pass http://web-frontend:3000;
        }
    }
}
